name: Test and Deploy (launchpad-web)

on:
  push:
    branches: [main]

concurrency:
  group: launchpad-web-deploy-main
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        # Skip gracefully if no test directory exists yet
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found, skipping flutter test."
          fi

      - name: Build web (release)
        # Full Dart compile + tree-shake — same as what Docker does on the VM.
        # Catches any Dart errors before wasting a 10+ min VM Docker build.
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=http://localhost:8010/api/v1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH port connectivity with retries
        run: |
          max_attempts=5
          wait_seconds=15
          for attempt in $(seq 1 $max_attempts); do
            echo "Checking SSH port (22) on ${{ secrets.VM_HOST }} - attempt $attempt/$max_attempts..."
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.VM_HOST }}/22" 2>/dev/null; then
              echo "Port 22 is reachable"
              exit 0
            fi
            if [ $attempt -lt $max_attempts ]; then
              echo "Connection failed. Waiting ${wait_seconds}s before retry..."
              sleep $wait_seconds
            fi
          done
          echo "Port 22 unreachable after $max_attempts attempts. Proceeding anyway..."
          # Don't fail the job; let appleboy action handle the connection

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          # key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}
          timeout: 600s
          command_timeout: 30m
          request_pty: false
          script: |
            set -e

            cd /root/launchpad-web
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # API and web intentionally share one compose project name
            # but are deployed from separate compose files.
            # This suppresses expected orphan warnings in logs.
            export COMPOSE_IGNORE_ORPHANS=1
            # Force non-interactive, line-based build logs in CI output.
            export COMPOSE_PROGRESS=plain
            export BUILDKIT_PROGRESS=plain

            # Rebuild web image — --env-file passes .env.demo vars into compose substitution
            # so API_BASE_URL is correctly injected as a Docker build arg
            docker compose -p launchpad_demo -f docker-compose.demo.yml --env-file .env.demo build --no-cache --progress=plain web

            # Capture the ID of the currently running web container (if any)
            old_container_id=$(docker ps -q --filter "name=demo_launchpad_web" || true)

            echo "⚡ Recreating web container..."
            # Recreate and start the new container. 
            # If this fails, roll back to starting the old container immediately.
            if ! docker compose -p launchpad_demo -f docker-compose.demo.yml --env-file .env.demo up -d web; then
              echo "⚠️ Docker compose up failed! Rolling back..."
              if [ -n "$old_container_id" ]; then
                docker start "$old_container_id" || true
              fi
              exit 1
            fi

            echo "🔍 Performing health checks on new container..."
            # Perform health check on the new container with retries
            passed=false
            for i in {1..20}; do
              if curl -fsS http://localhost:9010/health > /dev/null; then
                echo "✅ Web health check passed successfully!"
                passed=true
                break
              fi
              echo "Waiting for web health... attempt $i/20"
              sleep 3
            done

            # If health checks fail, stop the new container and start the old one back up.
            if [ "$passed" = false ]; then
              echo "❌ Health check failed! Rolling back to the previous container..."
              docker compose -p launchpad_demo -f docker-compose.demo.yml --env-file .env.demo stop web || true
              if [ -n "$old_container_id" ]; then
                docker start "$old_container_id" || true
              fi
              exit 1
            fi

            # Only clean up dangling images and cache on successful deploy
            echo "🧹 Cleaning up dangling images and build cache..."
            docker image prune -f
            docker builder prune -f
