name: Test and Deploy (launchpad-web)

on:
  push:
    branches: [main]

concurrency:
  group: launchpad-web-deploy-main
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Flutter 3.38.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        # Skip gracefully if no test directory exists yet
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found, skipping flutter test."
          fi

      - name: Build web (release)
        # Full Dart compile + tree-shake — same as what Docker does on the VM.
        # Catches any Dart errors before wasting a 10+ min VM Docker build.
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=http://localhost:8010/api/v1

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH port connectivity with retries
        run: |
          max_attempts=5
          wait_seconds=15
          for attempt in $(seq 1 $max_attempts); do
            echo "Checking SSH port (22) on ${{ secrets.VM_HOST }} - attempt $attempt/$max_attempts..."
            if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.VM_HOST }}/22" 2>/dev/null; then
              echo "Port 22 is reachable"
              exit 0
            fi
            if [ $attempt -lt $max_attempts ]; then
              echo "Connection failed. Waiting ${wait_seconds}s before retry..."
              sleep $wait_seconds
            fi
          done
          echo "Port 22 unreachable after $max_attempts attempts. Proceeding anyway..."
          # Don't fail the job; let appleboy action handle the connection

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          # key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_PASSWORD }}
          timeout: 600s
          command_timeout: 30m
          request_pty: false
          script: |
            set -e

            cd /root/launchpad-web
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # API and web intentionally share one compose project name
            # but are deployed from separate compose files.
            # This suppresses expected orphan warnings in logs.
            export COMPOSE_IGNORE_ORPHANS=1
            # Force non-interactive, line-based build logs in CI output.
            export COMPOSE_PROGRESS=plain
            export BUILDKIT_PROGRESS=plain

            # Rebuild web image — --env-file passes .env.demo vars into compose substitution
            # so API_BASE_URL is correctly injected as a Docker build arg
            docker compose -p launchpad_demo -f docker-compose.demo.yml --env-file .env.demo build --no-cache --progress=plain web

            # Force remove the old web container to avoid naming conflicts
            docker rm -f demo_launchpad_web 2>/dev/null || true

            # Remove stale web containers safely before bringing up the new one.
            # Some environments prepend random/hash prefixes to container names,
            # e.g. "8aac..._demo_launchpad_web", so match by name substring.
            stale_web_ids=$(docker ps -aq --filter "name=demo_launchpad_web")
            if [ -n "$stale_web_ids" ]; then
              docker rm -f $stale_web_ids || true
            fi

            # Start web with the newly built image
            docker compose -p launchpad_demo -f docker-compose.demo.yml --env-file .env.demo up -d web

            # Clean up dangling images
            # Remove dangling images AND stale build cache to free disk space
            docker image prune -f
            docker builder prune -f

            # Health check with retries: container may need a few seconds
            # to become ready after recreation.
            for i in {1..20}; do
              if curl -fsS http://localhost:9010/health > /dev/null; then
                echo "Web health check passed"
                exit 0
              fi
              echo "Waiting for web health... attempt $i/20"
              sleep 3
            done

            echo "Web health check failed after retries"
            exit 1
